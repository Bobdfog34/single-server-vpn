name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: SingleServerVPN.xcodeproj
  SCHEME: SingleServerVPN
  BUNDLE_ID: com.singleserver.vpn

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app and tunnel extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_EMIT_LOC_STRINGS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/SingleServerVPN.app"
          test -d "$APP"
          ./Scripts/make-ipa.sh "$APP" SingleServerVPN-unsigned.ipa
          ./Scripts/validate-ipa.sh SingleServerVPN-unsigned.ipa "$BUNDLE_ID"
          shasum -a 256 SingleServerVPN-unsigned.ipa > sha256.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SingleServerVPN-unsigned-ipa
          path: |
            SingleServerVPN-unsigned.ipa
            sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
