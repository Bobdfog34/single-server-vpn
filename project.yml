name: SingleServerVPN
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    APP_GROUP_ID: group.com.singleserver.vpn
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    COMPILER_INDEX_STORE_ENABLE: NO
packages:
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit.git
    from: "2.0.0"
targets:
  SingleServerVPN:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singleserver.vpn
    sources:
      - path: Sources/App
      - path: Sources/Shared
    resources:
      - path: Sources/Shared/Resources
      - path: Resources/AppIcon.png
    entitlements:
      path: Sources/App/SingleServerVPN.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Sources/App/Info.plist
    postBuildScripts:
      - name: Ensure explicit app icon
        script: |
          set -e
          cp "$SRCROOT/Resources/AppIcon.png" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.png"
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon.png" "$PLIST"
          for KEY in CFBundleIcons "CFBundleIcons~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :$KEY dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundlePrimaryIcon dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon.png" "$PLIST"
          done
    dependencies:
      - target: SingleServerVPNExtension
        embed: true
  SingleServerVPNExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singleserver.vpn.tunnel
        GENERATE_INFOPLIST_FILE: NO
    sources:
      - path: Sources/PacketTunnel
      - path: Sources/Shared
    resources:
      - path: Sources/Shared/Resources
    dependencies:
      - package: SwiftyXrayKit
    entitlements:
      path: Sources/PacketTunnel/SingleServerVPNExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Sources/PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Single Server VPN Tunnel
        CFBundleShortVersionString: "1.1.2"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
