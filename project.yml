name: SingleServerVPN
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    APP_GROUP_ID: group.com.singleserver.vpn
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    COMPILER_INDEX_STORE_ENABLE: NO
packages:
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit.git
    from: "2.0.0"
targets:
  SingleServerVPN:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singleserver.vpn
    sources:
      - path: Sources/App
      - path: Sources/Shared
    resources:
      - path: Sources/Shared/Resources/Assets.xcassets
      - path: Sources/Shared/Resources
    entitlements:
      path: Sources/App/SingleServerVPN.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Sources/App/Info.plist
    postBuildScripts:
      - name: Set packaged version
        script: |
          set -e
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.3" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 5" "$PLIST"
    dependencies:
      - target: SingleServerVPNExtension
        embed: true
  SingleServerVPNExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.singleserver.vpn.tunnel
        GENERATE_INFOPLIST_FILE: NO
    sources:
      - path: Sources/PacketTunnel
      - path: Sources/Shared
    resources:
      - path: Sources/Shared/Resources
    dependencies:
      - package: SwiftyXrayKit
    entitlements:
      path: Sources/PacketTunnel/SingleServerVPNExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Sources/PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Single Server VPN Tunnel
        CFBundleShortVersionString: "1.1.3"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
